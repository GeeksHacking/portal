[tools]
node = "24"
pnpm = "latest"
dotnet = "10.0.401"
aspire = "13.6.1"

[tasks.dev]
description = "Runs the dev server"
run = "aspire run --detach --non-interactive"

[tasks.codegen]
description = "Generates the WebApp API client with kubb against the production server"
run = """
OPENAPI_URL=https://portal-api.geekshacking.com/openapi/v1.json pnpm --dir GeeksHackingPortal.WebApp codegen
"""

[tasks.codegen-local]
description = "Generates the WebApp API client with kubb against the local dev server"
run = """
url=http://localhost:5227/openapi/v1.json

attempt=0
until curl --fail --silent --output /dev/null "$url"; do
  attempt=$((attempt + 1))
  if [ "$attempt" -ge 60 ]; then
    echo "Timed out waiting for $url" >&2
    exit 1
  fi
  sleep 1
done

OPENAPI_URL="$url" pnpm --dir GeeksHackingPortal.WebApp codegen
"""
depends = ["dev"]
